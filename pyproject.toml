[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "r34sch"
version = "1.3"
description = "The unofficial command line version of the infamous Rule 34."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPLv3" }
authors = [
    { name = "giudehx", email = "errno.giudetest@gmail.com" }
]
keywords = ["rule34", "cli", "terminal", "search", "download"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
]
dependencies = [
    "requests",
    "rich",
    "urllib3",
    "typing_extensions",
    "soupsieve",
    "Pygments",
    "pycparser",
    "curl_cffi",
    "charset-normalizer",
    "cffi",
    "certifi",
    "bs4",
    "beautifulsoup4",
    "xmltodict"
]

[project.urls]
Homepage = "https://github.com/giudehx/r34sch"
Repository = "https://github.com/giudehx/r34sch"
Issues = "https://github.com/giudehx/r34sch/issues"

[project.scripts]
r34sch = "r34sch.__main__:main"
